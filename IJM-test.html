<style>
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --text: #333333;
  --text-muted: #888888;
  --accent: #54C999;
  --accent-light: #d6f5e8;
  --border: #e0e0e0;
  --card-back: #666666;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.10);

  --auto-bg:#FAEEDA; --auto-border:#BA7517; --auto-text:#633806; --auto-dot:#EF9F27;
  --emo-bg:#FBEAF0;  --emo-border:#993556; --emo-text:#72243E;  --emo-dot:#D4537E;
  --blo-bg:#FCEBEB;  --blo-border:#A32D2D; --blo-text:#501313;  --blo-dot:#E24B4A;
  --acc-bg:#E6F1FB;  --acc-border:#185FA5; --acc-text:#042C53;  --acc-dot:#378ADD;
  --eq-bg:#E1F5EE;   --eq-border:#0F6E56;  --eq-text:#04342C;   --eq-dot:#1D9E75;
  --rel-bg:#EEEDFE;  --rel-border:#534AB7; --rel-text:#26215C;  --rel-dot:#7F77DD;
  --tra-bg:#EAF3DE;  --tra-border:#3B6D11; --tra-text:#173404;  --tra-dot:#639922;
  --vis-bg:#F1EFE8;  --vis-border:#5F5E5A; --vis-text:#2C2C2A;  --vis-dot:#888780;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }

/* ── Protección de imágenes ── */
img {
  -webkit-user-drag: none;
  -khtml-user-drag: none;
  -moz-user-drag: none;
  user-drag: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}
.img-protect {
  position: absolute;
  inset: 0;
  z-index: 2;
  cursor: default;
  -webkit-user-select: none;
  user-select: none;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #f0f0f0; }
::-webkit-scrollbar-thumb { background: #54C999; border-radius: 3px; }

body {
  font-family: 'Montserrat', sans-serif;
  background: #f8f8f8;
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--card-back);
  color: #FFFFFF;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.3rem;
  font-weight: 400;
  letter-spacing: 0.04em;
}
header h1 span { opacity: 0.5; font-size: 0.8em; }

/* ── NAV ── */
nav {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 52px;
  z-index: 99;
}
nav button {
  flex: 1;
  padding: 12px 8px;
  border: none;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.btn-nav-close {
  padding: 8px 14px;
  border: none;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: #E24B4A;
  cursor: pointer;
  border-left: 1px solid var(--border);
  white-space: nowrap;
  transition: background 0.2s;
}
.btn-nav-close:hover { background: #fff0f0; }
nav button.active {
  color: #54C999;
  border-bottom-color: #54C999;
  font-weight: 600;
}

/* ── VIEWS ── */
.view { display: none; padding: 20px; max-width: 480px; margin: 0 auto; }
.view.active { display: block; }

/* ── CATEGORY PILLS ── */
.cat-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.pill {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 0.75rem;
  font-weight: 400;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-muted);
}
.pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.pill[data-cat="auto"].active { border-color: var(--auto-border); color: var(--auto-text); background: var(--auto-bg); }
.pill[data-cat="emo"].active  { border-color: var(--emo-border);  color: var(--emo-text);  background: var(--emo-bg); }
.pill[data-cat="blo"].active  { border-color: var(--blo-border);  color: var(--blo-text);  background: var(--blo-bg); }
.pill[data-cat="acc"].active  { border-color: var(--acc-border);  color: var(--acc-text);  background: var(--acc-bg); }
.pill[data-cat="eq"].active   { border-color: var(--eq-border);   color: var(--eq-text);   background: var(--eq-bg); }
.pill[data-cat="rel"].active  { border-color: var(--rel-border);  color: var(--rel-text);  background: var(--rel-bg); }
.pill[data-cat="tra"].active  { border-color: var(--tra-border);  color: var(--tra-text);  background: var(--tra-bg); }
.pill[data-cat="vis"].active  { border-color: var(--vis-border);  color: var(--vis-text);  background: var(--vis-bg); }

/* ── HOME VIEW ── */
.deck-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.deck-count { font-size: 2rem; font-family: 'Montserrat', sans-serif; font-weight: 300; color: var(--accent); }
.deck-label { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }

.btn-draw {
  width: 100%;
  padding: 16px;
  background: var(--card-back);
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-size: 1.2rem;
  font-weight: 400;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-bottom: 12px;
}
.btn-draw:hover { opacity: 0.85; }
.btn-draw:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-reflexiones {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.88rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 16px;
}
.btn-reflexiones:hover { background: var(--accent); color: #FFFFFF; }
.btn-reset {
  width: 100%;
  padding: 11px;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 20px;
}
.btn-reset:hover { border-color: var(--accent); color: var(--accent); }

/* ── CARD ── */
.card-wrap {
  perspective: 1000px;
  margin-bottom: 20px;
}
.card {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: var(--radius);
  cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.card-back-face {
  background: #666666;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  /* Dorso: visible por defecto */
}
.card-front-face {
  transform: rotateY(180deg); /* Frente: se ve al hacer flip */
}
.card-back-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
  height: 100%;
  padding: 20px;
}
.card-back-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: #FFFFFF;
  text-transform: uppercase;
  white-space: nowrap;
}
.card-back-text .green { color: #54C999; }
.card-front-face-content {
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
}
.card-img {
  width: 100%;
  flex: 1;
  object-fit: cover;
  display: block;
}
.card-img-placeholder {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  opacity: 0.2;
}
.card-label {
  padding: 16px 20px;
  background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4));
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
.card-label .en {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.8rem;
  font-weight: 300;
  color: #FFFFFF;
  line-height: 1;
}
.card-label .es {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.08em;
  margin-top: 4px;
}
.card-label .cat-badge {
  display: inline-block;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 10px;
  margin-top: 8px;
  opacity: 0.9;
}

/* ── CARD DETAIL ── */
.card-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  display: none;
}
.card-detail.visible { display: block; }
.detail-num {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.detail-def {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 16px;
  font-style: italic;
}
.detail-qs { list-style: none; }
.detail-qs li {
  padding: 8px 0;
  border-top: 1px solid var(--border);
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.detail-qs li::before { content: '→ '; color: var(--accent); font-size: 0.75rem; }

.notes-area {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.88rem;
  color: var(--text);
  background: var(--bg);
  resize: vertical;
  min-height: 80px;
  margin-top: 14px;
  transition: border-color 0.2s;
}
.notes-area:focus { outline: none; border-color: var(--accent); }

/* ── EXPLORE VIEW ── */
.search-input {
  width: 100%;
  padding: 11px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.9rem;
  background: var(--surface);
  color: var(--text);
  margin-bottom: 12px;
}
.search-input:focus { outline: none; border-color: var(--accent); }

.explore-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.explore-card {
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  background: #666666;
  aspect-ratio: 4/3;
  position: relative;
  transition: transform 0.2s;
}
.explore-card:hover { transform: translateY(-2px); }
.explore-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0.85;
}
.explore-card .no-img {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  opacity: 0.15;
  color: #FFFFFF;
}
.explore-card .ec-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 28px 10px 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}
.explore-card .ec-label .en {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.1rem;
  color: #FFFFFF;
  font-weight: 300;
  line-height: 1;
}
.explore-card .ec-label .es {
  font-size: 0.68rem;
  color: rgba(255,255,255,0.6);
  margin-top: 2px;
}
.explore-card .num-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em;
}
.explore-count {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 14px;
  letter-spacing: 0.04em;
}

/* ── MODAL ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,24,20,0.75);
  z-index: 200;
  padding: 20px;
  overflow-y: auto;
}
.modal-bg.open { display: flex; align-items: flex-start; justify-content: center; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 440px;
  width: 100%;
  margin-top: 20px;
  overflow: hidden;
}
.modal-img-wrap {
  width: 100%;
  aspect-ratio: 4/3;
  background: #666666;
  overflow: hidden;
  position: relative;
}
.modal-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.modal-body { padding: 20px; }
.modal-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 2rem;
  font-weight: 300;
  margin-bottom: 2px;
}
.modal-sub {
  font-size: 0.82rem;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.modal-def {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.05rem;
  line-height: 1.65;
  font-style: italic;
  color: var(--text);
  margin-bottom: 16px;
}
.modal-qs { list-style: none; margin-bottom: 16px; }
.modal-qs li {
  padding: 7px 0;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.modal-qs li::before { content: '→ '; color: var(--accent); }
.modal-close {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.modal-close:hover { border-color: var(--accent); color: var(--accent); }

/* ── SESSION VIEW ── */
.session-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-family: 'Montserrat', sans-serif;
  font-size: 1.2rem;
  font-style: italic;
}
.session-card {
  display: flex;
  gap: 12px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.session-thumb {
  width: 56px;
  height: 75px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: #666666;
}
.session-thumb img { width: 100%; height: 100%; object-fit: cover; }
.session-thumb .st-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; opacity: 0.2; color: #FFFFFF; }
.session-info { flex: 1; }
.session-en {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.2rem;
  font-weight: 400;
  line-height: 1;
}
.session-es { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; margin-bottom: 6px; }
.session-note { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }

.btn-export {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1.5px solid var(--card-back);
  color: var(--card-back);
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 12px;
}
.btn-export:hover { background: var(--card-back); color: #FFFFFF; }
.btn-close-session {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1.5px solid #E24B4A;
  color: #E24B4A;
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 20px;
}
.btn-close-session:hover { background: #E24B4A; color: #fff; }

/* ── LOGIN ── */
.login-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: #666666;
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-screen.active { display: flex; }
.login-box {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 32px 28px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo img { width: 80px; border-radius: 12px; }
.login-logo h2 {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.4rem;
  font-weight: 300;
  margin-top: 12px;
  color: var(--text);
}
.login-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.login-tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.login-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.login-field {
  margin-bottom: 16px;
}
.login-field label {
  display: block;
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.login-field input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.9rem;
  color: var(--text);
  background: var(--bg);
  transition: border-color 0.2s;
}
.login-field input:focus { outline: none; border-color: var(--accent); }
.btn-login {
  width: 100%;
  padding: 14px;
  background: #666666;
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-top: 8px;
}
.btn-login:hover { opacity: 0.85; }
.login-error {
  color: #E24B4A;
  font-size: 0.8rem;
  text-align: center;
  margin-top: 12px;
  min-height: 20px;
}

/* ── MODAL CLIENTE ── */
.modal-cliente {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,24,20,0.75);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-cliente.open { display: flex; }
.modal-cliente-box {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px;
  max-width: 380px;
  width: 100%;
}
.modal-cliente-box h3 {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.4rem;
  font-weight: 300;
  margin-bottom: 6px;
}
.modal-cliente-box p {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

/* ── HISTORIAL ── */
.history-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.history-item:hover { border-color: var(--accent); }
.history-client {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.2rem;
  font-weight: 400;
}
.history-date {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
  margin-bottom: 8px;
}
.history-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.history-card-tag {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--accent-light);
  color: var(--accent);
}
.history-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 16px;
  display: none;
}
.history-detail.open { display: block; }
.history-detail-card {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.history-detail-card:last-child { border-bottom: none; }
.hdc-thumb {
  width: 48px;
  height: 36px;
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
  background: #666666;
}
.hdc-thumb img { width: 100%; height: 100%; object-fit: cover; }
.hdc-info .en { font-family: 'Montserrat', sans-serif; font-size: 1rem; }
.hdc-info .es { font-size: 0.72rem; color: var(--text-muted); }
.hdc-info .note { font-size: 0.78rem; color: var(--text-muted); font-style: italic; margin-top: 3px; }
.user-info {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 120px;
}
.btn-logout {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.7);
  padding: 5px 12px;
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.04em;
  flex-shrink: 0;
  white-space: nowrap;
}
.btn-logout:hover { border-color: rgba(255,255,255,0.7); color: #FFFFFF; }

/* ── PDF OVERLAY ── */
#pdf-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #f8f8f8;
  z-index: 500;
  overflow-y: auto;
  padding: 20px;
}
#pdf-overlay.open { display: block; }
.pdf-toolbar {
  position: sticky;
  top: 0;
  background: #666666;
  color: #fff;
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  margin: -20px -20px 20px -20px;
  z-index: 10;
}
.pdf-toolbar button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
}
.pdf-btn-print { background: #54C999; color: #fff; }
.pdf-btn-close { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4) !important; }
.pdf-card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.pdf-card img { width: 56px; height: 75px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
.pdf-card-en { font-size: 1rem; font-weight: 600; color: #333; }
.pdf-card-es { font-size: 0.78rem; color: #888; margin-top: 2px; }
.pdf-card-note { font-size: 0.8rem; color: #555; font-style: italic; margin-top: 4px; }
@media print {
  .pdf-toolbar { display: none !important; }
  #pdf-overlay { position: static; padding: 20px; }
}
/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card-back);
  color: #FFFFFF;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  z-index: 300;
  transition: transform 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

  {n:8,  en:'Awareness',      es:'Conciencia',           cat:'auto', def:'La capacidad de observar sin juzgar lo que ocurre dentro y fuera de nosotros. La conciencia es el primer paso del cambio.', q:['¿Eres consciente de tus patrones?','¿Qué parte de ti mismo aún no conoces bien?','¿Tu conciencia te ayuda a actuar mejor?','¿Observas o juzgas lo que percibes?','¿Qué necesitas hacer consciente hoy?']},
  {n:9,  en:'Balance',        es:'Equilibrio',           cat:'eq',  def:'El estado dinámico en que las distintas dimensiones de la vida se sostienen mutuamente sin que ninguna devore a las otras.', q:['¿Qué áreas de tu vida están desequilibradas?','¿Qué estás sacrificando en nombre del equilibrio?','¿El equilibrio es una meta o un proceso para ti?','¿Cómo te sientes cuando pierdes el equilibrio?','¿Qué pequeño ajuste mejoraría tu equilibrio hoy?']},

  {n:12, en:'Beliefs',        es:'Creencias',            cat:'blo', def:'Las convicciones profundas que filtran nuestra percepción de la realidad. No todas las creencias que tenemos nos pertenecen realmente.', q:['¿Qué creencias guían tus decisiones?','¿De dónde vienen tus creencias más limitantes?','¿Hay alguna creencia que necesitas cuestionar?','¿Qué creencia te ha protegido pero ya no te sirve?','¿Qué pasaría si cambiaras una creencia fundamental?']},
  {n:13, en:'Birth',          es:'Nacimiento',           cat:'tra', def:'El comienzo de algo nuevo: una fase, una relación, un proyecto, una versión de uno mismo. Todo nacimiento implica una separación.', q:['¿Qué está naciendo en tu vida ahora?','¿Estás listo para dar la bienvenida a lo nuevo?','¿Qué necesitas para que este nacimiento sea posible?','¿Qué debes dejar atrás para que algo nuevo nazca?','¿Qué estás ayudando a nacer en otros?']},
  {n:14, en:'Boundary',       es:'Límites',              cat:'rel', def:'Las fronteras que definen quién somos y lo que aceptamos. Los límites sanos son actos de amor hacia uno mismo y los demás.', q:['¿Tienes claros tus límites?','¿Los comunicas con claridad?','¿Respetas los límites de los demás?','¿Qué ocurre cuando alguien cruza tus límites?','¿Qué límite necesitas establecer ahora?']},
  {n:15, en:'Care',           es:'Cuidado',              cat:'rel', def:'La atención amorosa hacia uno mismo y los demás. El cuidado genuino requiere presencia, no solo acciones.', q:['¿Cómo te cuidas a ti mismo?','¿A quién cuidas y cómo lo haces?','¿El cuidado que das viene desde la libertad o la obligación?','¿Pides ayuda cuando la necesitas?','¿Qué aspecto de tu vida necesita más cuidado?']},
  {n:16, en:'Celebration',    es:'Celebración',          cat:'emo', def:'El reconocimiento consciente de los momentos, logros y personas que merecen ser honrados. Celebrar es una práctica de gratitud.', q:['¿Celebras tus logros?','¿Qué merece ser celebrado en tu vida ahora?','¿Compartes tus celebraciones?','¿Por qué a veces no te permites celebrar?','¿Qué pequeña victoria merece una celebración hoy?']},
  {n:17, en:'Clarity',        es:'Claridad',             cat:'vis', def:'El estado de ver con nitidez lo que es, lo que queremos y lo que nos mueve. La claridad no es certeza, es honestidad.', q:['¿Qué necesitas ver con más claridad?','¿Qué nubla tu visión ahora mismo?','¿Cuándo fue la última vez que tuviste una claridad total?','¿La claridad te libera o te da miedo?','¿Qué decisión tomarías si tuvieras más claridad?']},
  {n:18, en:'Confrontation',  es:'Confrontación',        cat:'rel', def:'El encuentro directo con una persona o situación difícil. La confrontación honesta, desde el respeto, puede transformar relaciones.', q:['¿Evitas la confrontación?','¿Cómo te sientes ante el conflicto?','¿Hay algo que necesitas confrontar ahora?','¿Qué temes que ocurra si confrontas?','¿Qué coste tiene evitar la confrontación?']},
  {n:19, en:'Connection',     es:'Conexión',             cat:'rel', def:'El encuentro genuino entre personas que se ven y se reconocen. La conexión real requiere vulnerabilidad y presencia.', q:['¿Con quién te sientes verdaderamente conectado?','¿Qué impide que te conectes más profundamente?','¿Buscas conexión o la evitas?','¿Hay alguna conexión que necesitas nutrir?','¿Qué conexión contigo mismo necesitas fortalecer?']},
  {n:20, en:'Contentment',    es:'Felicidad / plenitud', cat:'emo', def:'El estado de satisfacción profunda que no depende de circunstancias externas. La plenitud es una elección interior.', q:['¿Qué te hace sentir pleno?','¿Dependes de factores externos para ser feliz?','¿Puedes encontrar plenitud en lo cotidiano?','¿Qué te roba la plenitud?','¿Qué pequeña cosa te hace genuinamente feliz?']},
  {n:21, en:'Convenience',    es:'Conveniencia',         cat:'rel', def:'La elección de lo cómodo sobre lo auténtico. A veces la conveniencia nos protege, pero otras nos impide crecer.', q:['¿Eliges lo conveniente o lo auténtico?','¿Hay relaciones o situaciones que mantienes solo por conveniencia?','¿Qué pagarías por más comodidad?','¿Cuándo la conveniencia te ha limitado?','¿Qué harías diferente si no buscaas solo lo conveniente?']},
  {n:22, en:'Creativity',     es:'Creatividad',          cat:'vis', def:'La capacidad de generar algo nuevo a partir de lo que existe. La creatividad no es solo arte: es una forma de vivir.', q:['¿Cómo expresas tu creatividad?','¿Qué bloquea tu creatividad?','¿Te permites ser creativo sin juzgarte?','¿Qué crearías si no tuvieras miedo al fracaso?','¿En qué área de tu vida necesitas más creatividad?']},
  {n:23, en:'Crisis',         es:'Crisis',               cat:'tra', def:'Momento de ruptura que obliga a elegir entre quedarse o transformarse. Toda crisis contiene una semilla de oportunidad.', q:['¿Estás en una crisis ahora?','¿Qué te ha enseñado una crisis pasada?','¿Cómo respondes ante la crisis: te paralizas o te activas?','¿Qué oportunidad esconde tu crisis actual?','¿A quién o qué recurres en momentos de crisis?']},
  {n:24, en:'Death',          es:'Muerte',               cat:'tra', def:'El fin inevitable que da sentido a la vida. Contemplar la muerte nos ayuda a vivir con más autenticidad y presencia.', q:['¿Cómo te relacionas con la idea de la muerte?','¿La muerte de alguien cercano ha cambiado tu manera de vivir?','¿Qué quieres haber vivido antes de morir?','¿Qué parte de ti necesita morir para que algo nuevo nazca?','¿Cómo quieres ser recordado?']},
  {n:25, en:'Decision',       es:'Decisión',             cat:'acc', def:'El acto de elegir un camino entre varios posibles. Toda decisión es también una renuncia y una declaración de valores.', q:['¿Hay alguna decisión que estás evitando?','¿Cómo decides: con la cabeza, el corazón o las tripas?','¿Qué te paraliza a la hora de decidir?','¿Qué decisión del pasado te pesa?','¿Qué necesitas para tomar la decisión que sabes que debes tomar?']},
  {n:26, en:'Dedication',     es:'Dedicación',           cat:'acc', def:'La entrega sostenida a algo que consideramos valioso. La dedicación auténtica no necesita recompensa externa.', q:['¿A qué te dedicas con más pasión?','¿Tu dedicación es sostenible?','¿Qué merece más dedicación en tu vida?','¿Alguna vez te has perdido en la dedicación excesiva?','¿La dedicación que das viene desde el amor o la obligación?']},
  {n:27, en:'Defense',        es:'Defensa',              cat:'auto', def:'El mecanismo que protege nuestro espacio interior. Las defensas pueden ser necesarias o pueden convertirnos en prisiones.', q:['¿Qué defensas has construido?','¿Tus defensas te protegen o te aíslan?','¿Hay situaciones donde te pones a la defensiva?','¿De qué te estás protegiendo realmente?','¿Qué pasaría si bajaras la guardia?']},
  {n:28, en:'Determination',  es:'Determinación',        cat:'acc', def:'La fuerza interior que persiste ante los obstáculos. La determinación auténtica nace del propósito, no del ego.', q:['¿Cuándo muestras más determinación?','¿Tu determinación es flexible o rígida?','¿De dónde viene tu determinación?','¿Hay algo por lo que lucharías sin rendirte?','¿Qué te hace rendirte antes de tiempo?']},
  {n:29, en:'Distraction',    es:'Distracción',          cat:'blo', def:'Todo aquello que nos aleja del foco y la presencia. La distracción puede ser externa o un mecanismo para evitar lo importante.', q:['¿Qué te distrae con más frecuencia?','¿Usas la distracción para evitar algo?','¿Qué perderías si eliminaras tus distracciones principales?','¿Hay distracciones que en realidad son necesidades?','¿Cómo recuperas el foco cuando te dispersas?']},
  {n:30, en:'Dream',          es:'Sueño',                cat:'vis', def:'La imagen interior de un futuro deseado. Los sueños son brújulas: nos muestran la dirección antes de que el camino exista.', q:['¿Cuál es tu sueño más profundo?','¿Persigues tus sueños o los guardas en un cajón?','¿De quién son tus sueños?','¿Qué harías si supieras que no puedes fracasar?','¿Qué sueño has abandonado que merece ser retomado?']},
  {n:31, en:'Efficiency',     es:'Eficiencia',           cat:'acc', def:'La capacidad de obtener buenos resultados con los recursos disponibles. La eficiencia sin propósito puede vaciar de sentido la acción.', q:['¿Eres eficiente en lo que importa?','¿La eficiencia es un valor o una obsesión para ti?','¿Qué estás haciendo eficientemente pero sin propósito?','¿Sacrificas calidad por eficiencia?','¿Dónde necesitas ser más eficiente?']},
  {n:32, en:'Effort',         es:'Esfuerzo',             cat:'acc', def:'La energía invertida en conseguir algo que vale la pena. El esfuerzo tiene sentido cuando está alineado con nuestros valores.', q:['¿A qué dedicas tu mayor esfuerzo?','¿Tu esfuerzo está bien dirigido?','¿Reconoces el esfuerzo de los demás?','¿Cuándo el esfuerzo se convierte en autocastigo?','¿Hay algo que merece más esfuerzo del que le das?']},
  {n:33, en:'Ego',            es:'Ego',                  cat:'auto', def:'La construcción mental de quiénes creemos ser. El ego puede protegernos o separarnos de los demás y de nosotros mismos.', q:['¿Cuándo actúas desde el ego?','¿Cómo distingues entre el ego y el yo auténtico?','¿El ego te protege o te limita?','¿Cuándo sientes que el ego de alguien bloquea la relación?','¿Qué pasaría si soltaras la necesidad de tener razón?']},
  {n:34, en:'Elasticity',     es:'Elasticidad',          cat:'eq',  def:'La capacidad de adaptarse y recuperarse ante los cambios sin perder la esencia. La elasticidad es resiliencia en movimiento.', q:['¿Eres elástico ante los cambios?','¿Cuál es tu límite de elasticidad?','¿Qué te da rigidez?','¿Cómo te recuperas cuando algo te dobla?','¿Qué situación actual requiere más elasticidad de tu parte?']},
  {n:35, en:'Empowerment',    es:'Empoderamiento',       cat:'acc', def:'El proceso de reconocer y activar el poder propio. El empoderamiento no es arrebatar poder a otros: es recordar el que ya tienes.', q:['¿Te sientes empoderado en tu vida?','¿En qué áreas te falta poder personal?','¿Cómo empoderas a los demás?','¿Qué creencia te quita poder?','¿Qué acción te haría sentir más poderoso hoy?']},
  {n:36, en:'Empty',          es:'Vacío',                cat:'tra', def:'El espacio interior que puede ser sufrimiento o posibilidad. El vacío bien habitado es la antesala de la plenitud.', q:['¿Dónde sientes vacío?','¿Intentas llenarlo o lo acompañas?','¿Qué has perdido que dejó ese vacío?','¿Puede el vacío ser una oportunidad?','¿Qué tiene que ver el vacío con lo que más anhelas?']},
  {n:37, en:'End',            es:'Final',                cat:'tra', def:'La conclusión de un ciclo que abre espacio para el siguiente. Los finales bien vividos son los que permiten los mejores comienzos.', q:['¿Qué está llegando a su fin en tu vida?','¿Cómo te relacionas con los finales?','¿Hay algo que necesitas cerrar?','¿Puedes honrar un final sin aferrarte a él?','¿Qué nuevo comienzo está esperando este final?']},
  {n:38, en:'Excess',         es:'Exceso',               cat:'blo', def:'Aquello que tenemos o hacemos de más y que nos desequilibra. El exceso suele tapar una carencia más profunda.', q:['¿En qué área de tu vida hay exceso?','¿Qué necesidad profunda intenta cubrir ese exceso?','¿Qué coste tiene para ti?','¿Cuándo el exceso se convirtió en hábito?','¿Qué ganarías si redujeras ese exceso?']},
  {n:39, en:'Exit',           es:'Salida',               cat:'tra', def:'El camino de salida de una situación que ya no nos sirve. Encontrar la salida requiere coraje para reconocer que algo ha terminado.', q:['¿De qué necesitas salir?','¿Ves salidas o te sientes atrapado?','¿Qué te impide usar la salida que ves?','¿Qué perderías si salieras?','¿Qué ganarías?']},
  {n:40, en:'Fantasy',        es:'Fantasía',             cat:'emo', def:'La imaginación que construye mundos posibles. La fantasía puede ser inspiradora o un escape de la realidad.', q:['¿Qué fantasías tienes?','¿Tu fantasía te inspira o te evade?','¿Hay algo de tu fantasía que podrías hacer realidad?','¿Qué dice tu fantasía de lo que deseas?','¿Qué tan lejos está tu fantasía de tu vida real?']},
  {n:41, en:'Fear',           es:'Miedo',                cat:'emo', def:'La señal que nos avisa del peligro, real o imaginado. El miedo bien escuchado nos protege; el miedo ignorado nos paraliza.', q:['¿Qué es lo que más temes?','¿Tu miedo te protege o te limita?','¿De dónde viene ese miedo?','¿Qué harías si no tuvieras miedo?','¿Puedes actuar a pesar del miedo?']},
  {n:42, en:'Fight',          es:'Lucha',                cat:'acc', def:'El esfuerzo activo ante la resistencia. La lucha puede ser contra obstáculos externos o contra nuestras propias limitaciones.', q:['¿Por qué estás luchando?','¿Tu lucha viene de la convicción o del miedo?','¿Hay luchas que deberías abandonar?','¿Estás luchando contra algo o hacia algo?','¿Qué necesitarías para dejar de luchar y fluir?']},
  {n:43, en:'Flexibility',    es:'Flexibilidad',         cat:'eq',  def:'La capacidad de adaptarse sin perder la esencia. La flexibilidad no es debilidad: es inteligencia ante el cambio.', q:['¿Eres flexible en tus ideas y planes?','¿Cuándo la rigidez te ha perjudicado?','¿Qué te cuesta más trabajo soltar?','¿Dónde necesitas más flexibilidad?','¿Hay algo en lo que ser más firme?']},
  {n:44, en:'Flow',           es:'Fluir',                cat:'eq',  def:'El estado en que la acción se produce con naturalidad y sin esfuerzo excesivo. Fluir es confiar en el proceso.', q:['¿Cuándo fluyes con más facilidad?','¿Qué bloquea tu flujo?','¿Puedes confiar en el proceso sin controlarlo todo?','¿Qué actividad te hace fluir?','¿Qué tendrías que soltar para fluir más?']},
  {n:45, en:'Focus',          es:'Foco',                 cat:'acc', def:'La capacidad de dirigir la atención hacia lo esencial. El foco no es restricción: es elegir conscientemente dónde poner la energía.', q:['¿En qué estás enfocado ahora?','¿Tu foco está en lo importante o en lo urgente?','¿Qué te hace perder el foco?','¿Hay algo que merece más de tu atención?','¿Cómo recuperas el foco cuando lo pierdes?']},
  {n:46, en:'Friendship',     es:'Amistad',              cat:'rel', def:'El vínculo elegido que se construye en la autenticidad y la reciprocidad. La amistad verdadera sobrevive al tiempo y a la distancia.', q:['¿Qué significa la amistad para ti?','¿Cuidas tus amistades?','¿Eres el amigo que te gustaría tener?','¿Hay alguna amistad que necesites nutrir?','¿Qué busca en un amigo?']},
  {n:47, en:'Future',         es:'Futuro',               cat:'vis', def:'El territorio de las posibilidades que aún no han ocurrido. El futuro que construimos depende de las elecciones que hacemos hoy.', q:['¿Cómo imaginas tu futuro?','¿Tu futuro te inspira o te preocupa?','¿Qué estás haciendo hoy para construir el futuro que quieres?','¿Vives más en el futuro que en el presente?','¿Qué versión de ti mismo quieres ser en el futuro?']},
  {n:48, en:'Goal',           es:'Objetivo',             cat:'vis', def:'Resultado concreto y deseado que orienta la acción. Un buen objetivo es claro, relevante y conectado con los valores más profundos.', q:['¿Cuál es tu objetivo en este momento?','¿Este objetivo es tuyo o fue impuesto por otros?','¿Sabes por qué quieres lo que quieres?','¿Tu objetivo está alineado con tus valores?','¿Qué te impide avanzar hacia tu objetivo?']},
  {n:49, en:'Gratitude',      es:'Gratitud',             cat:'emo', def:'Reconocimiento consciente de lo que se tiene y lo que se ha recibido. La gratitud cambia la perspectiva y abre el corazón.', q:['¿Por qué estás agradecido en este momento?','¿Qué das por sentado que merece reconocimiento?','¿Expresas tu gratitud a quienes te rodean?','¿Puedes encontrar algo por lo que agradecer incluso en lo difícil?','¿La gratitud es parte de tu vida cotidiana?']},
  {n:50, en:'Hiding',         es:'Escondite',            cat:'blo', def:'Tendencia a ocultarse, a no mostrarse o a refugiarse para evitar el riesgo del encuentro real con otros o con uno mismo.', q:['¿Qué parte de ti estás escondiendo?','¿Por qué te escondes?','¿A qué coste te escondes?','¿Cuándo fue la última vez que te mostraste plenamente?','¿Qué pasaría si dejaras de esconderte?']},
  {n:51, en:'Hope',           es:'Esperanza',            cat:'emo', def:'Expectativa positiva hacia el futuro que sostiene la acción y da sentido en los momentos difíciles.', q:['¿En qué tienes esperanza?','¿Tu esperanza está activa o es pasiva?','¿Qué alimenta tu esperanza?','¿Qué harías diferente si tuvieras más esperanza?','¿Hay algo en lo que has perdido la esperanza que merece ser revisado?']},
  {n:52, en:'Identity',       es:'Identidad',            cat:'auto', def:'El conjunto de características, valores, historia y forma de ser que nos define y distingue como individuos únicos.', q:['¿Cómo te defines a ti mismo?','¿Tu identidad actual te representa?','¿Qué parte de tu identidad es tuya y cuál fue construida por otros?','¿Ha cambiado tu identidad en los últimos años?','¿Qué partes de ti mismo todavía no conoces bien?']},
  {n:53, en:'Impulse',        es:'Impulso',              cat:'acc', def:'Fuerza interna que surge espontáneamente y motiva a la acción. Puede ser creativo y vital o descontrolado.', q:['¿Qué impulsos sientes ahora mismo?','¿Actúas desde el impulso o desde la reflexión?','¿Cuándo tus impulsos te han llevado a buen lugar?','¿Hay impulsos que necesitas gestionar mejor?','¿Qué impulso creativo estás ignorando?']},
  {n:54, en:'Initiative',     es:'Iniciativa',           cat:'acc', def:'Capacidad de comenzar algo por propia voluntad, sin esperar a que otros lo hagan o a que las condiciones sean perfectas.', q:['¿Tomas iniciativa en tu vida?','¿Esperas permiso para actuar?','¿En qué áreas te falta iniciativa?','¿Cuándo fue la última vez que iniciaste algo nuevo?','¿Qué iniciativa llevas tiempo posponiendo?']},
  {n:55, en:'Intimacy',       es:'Intimidad',            cat:'rel', def:'La capacidad de mostrarse vulnerable y auténtico ante otro. La intimidad requiere confianza y disposición a ser vistos.', q:['¿Te permites la intimidad?','¿Qué te impide ser íntimo con otros?','¿Hay personas con quienes deseas una mayor intimidad?','¿Confundes intimidad con dependencia?','¿Qué necesitas para abrirte más?']},
  {n:56, en:'Introspection',  es:'Introspección',        cat:'auto', def:'La mirada hacia adentro que nos permite conocernos mejor. La introspección honesta es la base del crecimiento personal.', q:['¿Practicas la introspección regularmente?','¿Qué has descubierto de ti mismo recientemente?','¿La introspección te ayuda o te genera rumiación?','¿Qué parte de ti mismo evitas mirar?','¿Qué pregunta interior llevas tiempo sin responder?']},
  {n:57, en:'Leadership',     es:'Liderazgo',            cat:'acc', def:'La capacidad de inspirar y guiar a otros desde el ejemplo y la autenticidad. El verdadero liderazgo empieza por liderarse a uno mismo.', q:['¿Cómo ejerces tu liderazgo?','¿Lideras desde el miedo o desde la confianza?','¿Qué tipo de líder eres?','¿Dónde necesitas más liderazgo en tu vida?','¿Qué harías diferente como líder?']},
  {n:58, en:'Legacy',         es:'Legado',               cat:'vis', def:'Lo que dejamos en el mundo y en los demás cuando ya no estemos. El legado se construye con cada elección cotidiana.', q:['¿Qué legado quieres dejar?','¿Estás construyendo ese legado ahora?','¿Qué has recibido de otros como legado?','¿Qué te gustaría que dijeran de ti?','¿Tu vida actual refleja el legado que deseas?']},
  {n:59, en:'Liberation',     es:'Liberación',           cat:'tra', def:'El proceso de soltar aquello que nos encadena: miedos, creencias, relaciones tóxicas, roles que ya no nos sirven.', q:['¿De qué necesitas liberarte?','¿Qué te tiene encadenado?','¿Has vivido alguna liberación profunda?','¿Qué precio pagarías por esa libertad?','¿Qué sería posible si te liberaras?']},
  {n:60, en:'Life',           es:'Vida',                 cat:'auto', def:'La experiencia total de existir, con su complejidad, contradicciones y belleza. ¿Cómo estás viviendo tu vida?', q:['¿Cómo describes tu vida en este momento?','¿Estás viviendo la vida que quieres?','¿Qué le falta a tu vida?','¿Qué sobra?','¿Qué cambiarías si pudieras?']},
  {n:61, en:'Light',          es:'Ligereza / levedad',   cat:'eq',  def:'La cualidad de no cargar con más de lo necesario. La ligereza no es superficialidad: es la sabiduría de soltar el peso innecesario.', q:['¿Te sientes ligero o cargado?','¿Qué te pesa?','¿Qué podrías soltar para sentirte más ligero?','¿Cuándo fue la última vez que te sentiste realmente liviano?','¿Qué te da ligereza?']},
  {n:62, en:'Listening',      es:'Escucha',              cat:'rel', def:'La capacidad de recibir al otro con presencia y sin agenda. Escuchar de verdad es uno de los mayores actos de respeto.', q:['¿Escuchas de verdad o esperas tu turno para hablar?','¿Quién te escucha de verdad?','¿A quién necesitas escuchar más?','¿Qué te impide escuchar plenamente?','¿Qué escuchas cuando haces silencio?']},
  {n:63, en:'Load',           es:'Carga',                cat:'eq',  def:'El peso que llevamos: responsabilidades, preocupaciones, expectativas propias y ajenas. No toda carga es nuestra.', q:['¿Qué carga llevas ahora?','¿Es tuya o la tomaste de otro?','¿Puedes compartirla?','¿Qué pasaría si la soltaras?','¿Hay alguna carga que lleves innecesariamente?']},
  {n:64, en:'Love',           es:'Amor',                 cat:'emo', def:'La fuerza más poderosa de conexión y transformación. El amor verdadero empieza por uno mismo y se expande hacia los demás.', q:['¿Cómo te relacionas con el amor?','¿Te permites ser amado?','¿Amas desde la libertad o la dependencia?','¿Qué forma toma el amor en tu vida ahora?','¿Hay alguien a quien necesites decirle que lo amas?']},
  {n:65, en:'Luck',           es:'Suerte',               cat:'blo', def:'La creencia en que el destino depende del azar. Cuando atribuimos todo a la suerte, perdemos la agencia sobre nuestra vida.', q:['¿Crees en la suerte?','¿La suerte te ha favorecido o desfavorecido?','¿Usas la suerte para explicar tus resultados?','¿Qué parte de tu éxito o fracaso depende de ti?','¿Qué pasaría si dejaras de esperar que la suerte cambie las cosas?']},
  {n:66, en:'Mask',           es:'Máscara',              cat:'auto', def:'El personaje que presentamos al mundo para proteger nuestro interior. Las máscaras pueden ser necesarias o convertirse en prisiones.', q:['¿Qué máscara usas más frecuentemente?','¿Para qué la usas?','¿Cuándo te permites quitártela?','¿Qué hay detrás de tu máscara?','¿Quién te ve sin máscara?']},
  {n:67, en:'Measure',        es:'Medir',                cat:'acc', def:'La capacidad de evaluar el progreso y los resultados. Medir bien nos ayuda a ajustar el rumbo sin perder el propósito.', q:['¿Cómo mides tu éxito?','¿Tus métricas reflejan lo que realmente importa?','¿Te comparas con otros para medirte?','¿Qué indicadores usas para saber que vas bien?','¿Hay algo que no estás midiendo y deberías?']},
  {n:68, en:'Memory',         es:'Memoria',              cat:'auto', def:'El archivo viviente de nuestra experiencia. La memoria nos da identidad pero también puede anclar en el pasado.', q:['¿Qué memorias te dan fuerza?','¿Hay memorias que te pesan?','¿Cuándo el pasado te impide vivir el presente?','¿Qué recuerdos quieres crear?','¿Hay algo del pasado que necesitas revisar?']},
  {n:69, en:'Momentum',       es:'Momento',              cat:'acc', def:'La energía acumulada que impulsa hacia adelante. El momentum se construye con pequeñas acciones consistentes.', q:['¿Tienes momentum ahora?','¿Qué lo frena?','¿Cómo construyes impulso en tus proyectos?','¿Cuándo pierdes el momentum y por qué?','¿Qué acción pequeña podrías tomar para crear momentum hoy?']},
  {n:70, en:'Neglect',        es:'Abandonar / descuidar',cat:'blo', def:'La tendencia a dejar de lado lo que necesita atención. A veces abandonamos lo importante por lo urgente.', q:['¿Qué estás descuidando?','¿Qué has abandonado que merece ser retomado?','¿Por qué lo abandonaste?','¿Qué coste tiene ese abandono?','¿Qué daría un pequeño paso de atención a lo que descuidas?']},

// ── STATE ──
const state = {
  deck: [...CONCEPTS],
  drawn: [],
  current: null,
  notes: {},
  homeFilter: 'all',
  exploreFilter: 'all',
  flipped: false,
};

function imgUrl(n) { return IMG_BASE + n + '.jpg'; }

// ── VIEWS ──
function showView(v, btn) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  if (btn) btn.classList.add('active');
  if (v === 'session') renderSession();
}

// ── CATEGORY PILLS ──
function buildPills(containerId, currentFilter, onChange) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'pill' + (currentFilter === 'all' ? ' active' : '');
  all.textContent = 'Todas';
  all.onclick = () => { onChange('all'); };
  c.appendChild(all);
  Object.entries(CATS).forEach(([id, cat]) => {
    const b = document.createElement('button');
    b.className = 'pill' + (currentFilter === id ? ' active' : '');
    b.dataset.cat = id;
    b.textContent = cat.label;
    b.onclick = () => { onChange(id); };
    c.appendChild(b);
  });
}

function setHomeFilter(f) {
  state.homeFilter = f;
  buildPills('home-pills', f, setHomeFilter);
  updateDeckInfo();
}
function setExploreFilter(f) {
  state.exploreFilter = f;
  buildPills('explore-pills', f, setExploreFilter);
  renderExploreGrid();
}

// ── DECK ──
function updateDeckInfo() {
  const available = state.deck.filter(c => state.homeFilter === 'all' || c.cat === state.homeFilter);
  document.getElementById('deck-count').textContent = available.length;
  document.getElementById('drawn-count').textContent = state.drawn.length;
  document.getElementById('btn-draw').disabled = available.length === 0;
}

function drawCard() {
  const pool = state.deck.filter(c => state.homeFilter === 'all' || c.cat === state.homeFilter);
  if (!pool.length) return;
  const idx = Math.floor(Math.random() * pool.length);
  const card = pool[idx];
  state.deck = state.deck.filter(c => c.n !== card.n);
  state.drawn.push(card);
  state.current = card;
  state.flipped = false;
  showCardFace(card);
  updateDeckInfo();
  saveCardToSupabase(card);
}

function showCardFace(card) {
  const wrap = document.getElementById('card-wrap');
  const cardEl = document.getElementById('card');
  wrap.style.display = 'block';
  cardEl.classList.remove('flipped'); // Mostrar dorso primero
  state.flipped = false;

  // Preparar cara delantera (oculta hasta flip)
  const img = document.getElementById('card-img');
  const ph = document.getElementById('card-img-ph');
  img.src = imgUrl(card.n);
  img.style.display = 'block';
  ph.style.display = 'none';

  document.getElementById('card-label').style.display = 'none';
  const cat = CATS[card.cat];
  document.getElementById('card-label').innerHTML = `
    <div class="en">${card.en}</div>
    <div class="es">${card.es}</div>
    <span class="cat-badge" style="background:${cat.bg};color:${cat.text};border:1px solid ${cat.border}">${cat.label}</span>
  `;

  // Ocultar detalle y botón hasta que se voltee
  document.getElementById('card-detail').classList.remove('visible');
  document.getElementById('btn-reflexiones').style.display = 'none';
  document.getElementById('detail-num').textContent = `Carta #${card.n} · ${CATS[card.cat].label}`;
  document.getElementById('detail-def').textContent = card.def;
  const qs = document.getElementById('detail-qs');
  qs.innerHTML = card.q.map(q => `<li>${q}</li>`).join('');
  const notes = document.getElementById('notes-area');
  notes.value = state.notes[card.n] || '';
}

function flipCard() {
  if (!state.current) return;
  if (state.flipped) return; // Ya está volteada
  const cardEl = document.getElementById('card');
  cardEl.classList.add('flipped');
  state.flipped = true;
  // Tras el flip: mostrar imagen SIN etiqueta + botón "Ver reflexiones"
  setTimeout(() => {
    document.getElementById('card-label').style.display = 'none'; // etiqueta oculta
    document.getElementById('btn-reflexiones').style.display = 'block'; // botón visible
  }, 400);
}

function showDetail() {
  // Al pulsar "Ver reflexiones": mostrar etiqueta + detalle
  document.getElementById('card-label').style.display = 'block';
  document.getElementById('card-detail').classList.add('visible');
  document.getElementById('btn-reflexiones').style.display = 'none';
}

function saveNote() {
  if (state.current) {
    const note = document.getElementById('notes-area').value;
    state.notes[state.current.n] = note;
    try { localStorage.setItem('ijm_notes', JSON.stringify(state.notes)); } catch(e) {}
    saveNoteToSupabase(state.current.n, note);
  }
}

function resetDeck() {
  if (state.drawn.length && !confirm('¿Reiniciar la baraja? Las notas se mantendrán.')) return;
  state.deck = [...CONCEPTS];
  state.drawn = [];
  state.current = null;
  document.getElementById('card-wrap').style.display = 'none';
  document.getElementById('card-detail').classList.remove('visible');
  document.getElementById('btn-reflexiones').style.display = 'none';
  updateDeckInfo();
  showToast('Baraja reiniciada');
}

// ── EXPLORE ──
function filterExplore() {
  renderExploreGrid();
}

function renderExploreGrid() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const cat = state.exploreFilter;
  const filtered = CONCEPTS.filter(c => {
    const matchCat = cat === 'all' || c.cat === cat;
    const matchSearch = !search || c.en.toLowerCase().includes(search) || c.es.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });
  document.getElementById('explore-count').textContent = filtered.length + ' conceptos';
  const grid = document.getElementById('explore-grid');
  grid.innerHTML = filtered.map(c => `
    <div class="explore-card" onclick="openModal(${c.n})">
      <img src="${imgUrl(c.n)}" alt="${c.en}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><div class="img-protect"></div>
      <div class="no-img" style="display:none">🌿</div>
      <div class="num-badge">#${c.n}</div>
      <div class="ec-label">
        <div class="en">${c.en}</div>
        <div class="es">${c.es}</div>
      </div>
      ${state.notes[c.n] ? '<div style="position:absolute;top:8px;right:8px;color:rgba(255,255,255,0.7);font-size:0.75rem">✎</div>' : ''}
    </div>
  `).join('');
}

// ── MODAL ──
function openModal(n) {
  const c = CONCEPTS.find(x => x.n === n);
  if (!c) return;
  document.getElementById('modal-img').src = imgUrl(c.n);
  document.getElementById('modal-img').style.display = 'block';
  document.getElementById('modal-title').textContent = c.en;
  document.getElementById('modal-sub').textContent = `${c.es} · Carta #${c.n} · ${CATS[c.cat].label}`;
  document.getElementById('modal-def').textContent = c.def;
  document.getElementById('modal-qs').innerHTML = c.q.map(q => `<li>${q}</li>`).join('');
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('modal-bg')) closeModalBtn();
}
function closeModalBtn() {
  document.getElementById('modal-bg').classList.remove('open');
}

// ── SESSION ──
function renderSession() {
  const list = document.getElementById('session-list');
  if (!state.drawn.length) {
    list.innerHTML = '<div class="session-empty">Aún no has extraído ninguna carta</div>';
    return;
  }
  list.innerHTML = state.drawn.map((c, i) => `
    <div class="session-card">
      <div class="session-thumb">
        <img src="${imgUrl(c.n)}" alt="${c.en}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><div class="img-protect"></div>
        <div class="st-ph" style="display:none">🌿</div>
      </div>
      <div class="session-info">
        <div class="session-en">${i+1}. ${c.en}</div>
        <div class="session-es">${c.es} · #${c.n}</div>
        ${state.notes[c.n] ? `<div class="session-note">${state.notes[c.n].substring(0,80)}${state.notes[c.n].length > 80 ? '…' : ''}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function closeSession() {
  var m = document.getElementById('modal-confirm');
  m.style.display = 'flex';
}
async function confirmClose(yes) {
  document.getElementById('modal-confirm').style.display = 'none';
  if (!yes) return;
  // Guardar todas las notas en Supabase antes de cerrar
  if (currentSessionId && Object.keys(state.notes).length) {
    try {
      var saves = Object.keys(state.notes).map(function(n) {
        return supa.from('session_cards')
          .update({ notes: state.notes[n] })
          .eq('session_id', currentSessionId)
          .eq('card_number', parseInt(n));
      });
      await Promise.all(saves);
    } catch(e) {}
  }
  state.deck = [...CONCEPTS];
  state.drawn = [];
  state.current = null;
  state.notes = {};
  state.flipped = false;
  currentSessionId = null;
  currentClientName = '';
  try { localStorage.removeItem('ijm_notes'); } catch(e) {}
  document.getElementById('card-wrap').style.display = 'none';
  document.getElementById('card-detail').classList.remove('visible');
  document.getElementById('btn-reflexiones').style.display = 'none';
  updateDeckInfo();
  renderSession();
  showToast('Sesión guardada y cerrada');
  // Pedir nombre del nuevo cliente
  document.getElementById('modal-cliente').classList.add('open');
}

function pdfSession() {
  if (!state.drawn.length) { showToast('No hay cartas en la sesión'); return; }
  var fecha = new Date().toLocaleDateString('es-ES', {day:'2-digit', month:'long', year:'numeric'});
  var cliente = currentClientName || '';
  var hdr = document.getElementById('pdf-header');
  var cards = document.getElementById('pdf-cards');
  hdr.innerHTML = '<div style="border-bottom:3px solid #54C999;padding-bottom:12px;margin-bottom:20px">'
    + '<div style="font-weight:800;font-size:1.1rem;letter-spacing:0.1em">INNER<span style="color:#54C999">JOURNEY</span>METHOD&#8482;</div>'
    + (cliente ? '<div style="font-size:0.85rem;color:#555;margin-top:6px">Cliente: <strong>' + cliente + '</strong></div>' : '')
    + '<div style="font-size:0.8rem;color:#888;margin-top:2px">' + fecha + '</div></div>';
  var html = '';
  state.drawn.forEach(function(c, i) {
    var nota = state.notes[c.n] ? '<div class="pdf-card-note">' + state.notes[c.n] + '</div>' : '';
    html += '<div class="pdf-card">'
      + '<img src="' + imgUrl(c.n) + '">'
      + '<div><div class="pdf-card-en">' + (i+1) + '. ' + c.en + '</div>'
      + '<div class="pdf-card-es">' + c.es + ' &middot; #' + c.n + ' &middot; ' + CATS[c.cat].label + '</div>'
      + nota + '</div></div>';
  });
  cards.innerHTML = html;
  document.getElementById('pdf-overlay').classList.add('open');
}

function exportSession() {
  if (!state.drawn.length) { showToast('No hay cartas en la sesión'); return; }
  let txt = 'SESIÓN INNER JOURNEY METHOD™\n';
  txt += new Date().toLocaleDateString('es-ES', {day:'2-digit', month:'long', year:'numeric'}) + '\n';
  txt += '='.repeat(40) + '\n\n';
  state.drawn.forEach((c, i) => {
    txt += `${i+1}. ${c.en} / ${c.es} [Carta #${c.n} · ${CATS[c.cat].label}]\n`;
    if (state.notes[c.n]) txt += `   Notas: ${state.notes[c.n]}\n`;
    txt += '\n';
  });
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sesion_IJM.txt';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Sesión exportada');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── LOGIN / SUPABASE ──
function switchTab(tab) {
  document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.login-tab').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-error').textContent = '';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  if (!email || !pass) { document.getElementById('login-error').textContent = 'Rellena todos los campos'; return; }
  const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
  if (error) { document.getElementById('login-error').textContent = 'Email o contraseña incorrectos'; return; }
  onLogin(data.user);
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!name || !email || !pass) { errEl.textContent = 'Rellena todos los campos'; return; }
  if (pass.length < 6) { errEl.textContent = 'La contrasena debe tener al menos 6 caracteres'; return; }
  errEl.style.color = 'var(--text-muted)';
  errEl.textContent = 'Creando cuenta...';
  try {
    const { data, error } = await supa.auth.signUp({ email, password: pass, options: { data: { name } } });
    if (error) {
      errEl.style.color = '#E24B4A';
      errEl.textContent = error.message;
      return;
    }
    if (data.user && !data.session) {
      errEl.style.color = '#1D9E75';
      errEl.textContent = 'Revisa tu email para confirmar la cuenta, luego entra con tus datos.';
      return;
    }
    if (data.user) {
      errEl.style.color = 'var(--text-muted)';
      errEl.textContent = '';
      onLogin(data.user);
    }
  } catch(e) {
    errEl.style.color = '#E24B4A';
    errEl.textContent = 'Error de conexion. Intentalo de nuevo.';
  }
}

async function doLogout() {
  await supa.auth.signOut();
  currentUser = null;
  currentSessionId = null;
  currentClientName = '';
  state.deck = [...CONCEPTS];
  state.drawn = [];
  state.current = null;
  state.notes = {};
  state.homeFilter = 'all';
  state.exploreFilter = 'all';
  state.flipped = false;
  try { localStorage.removeItem('ijm_notes'); } catch(e) {}
  document.getElementById('card-wrap').style.display = 'none';
  document.getElementById('card-detail').classList.remove('visible');
  document.getElementById('btn-reflexiones').style.display = 'none';
  updateDeckInfo();
  renderSession();
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-home').classList.add('active');
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.querySelector('nav button').classList.add('active');
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('user-email').textContent = '';
}

function onLogin(user) {
  currentUser = user;
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('user-email').textContent = user.email;
  // Pedir nombre del cliente
  document.getElementById('modal-cliente').classList.add('open');
}

async function cancelSession() {
  document.getElementById('modal-cliente').classList.remove('open');
  // Guardar notas pendientes en Supabase si hay sesión activa
  if (currentSessionId && Object.keys(state.notes).length) {
    try {
      var saves = Object.keys(state.notes).map(function(n) {
        return supa.from('session_cards')
          .update({ notes: state.notes[n] })
          .eq('session_id', currentSessionId)
          .eq('card_number', parseInt(n));
      });
      await Promise.all(saves);
    } catch(e) {}
  }
  // Limpiar estado
  state.deck = [...CONCEPTS];
  state.drawn = [];
  state.current = null;
  state.notes = {};
  state.flipped = false;
  currentSessionId = null;
  currentClientName = '';
  try { localStorage.removeItem('ijm_notes'); } catch(e) {}
  document.getElementById('card-wrap').style.display = 'none';
  document.getElementById('card-detail').classList.remove('visible');
  document.getElementById('btn-reflexiones').style.display = 'none';
  document.getElementById('cliente-nombre').value = '';
  document.getElementById('cliente-error').textContent = '';
  updateDeckInfo();
  renderSession();
}

async function startSession() {
  const name = document.getElementById('cliente-nombre').value.trim();
  const errEl = document.getElementById('cliente-error');
  if (!name) { errEl.textContent = 'Escribe el nombre del cliente'; return; }
  errEl.style.color = 'var(--text-muted)';
  errEl.textContent = 'Creando sesión...';
  try {
    const { data, error } = await supa.from('sessions').insert({
      facilitator_id: currentUser.id,
      client_name: name
    }).select().single();
    if (error || !data) {
      errEl.style.color = '#E24B4A';
      errEl.textContent = 'Error al crear sesión. Inténtalo de nuevo.';
      return;
    }
    currentSessionId = data.id;
    currentClientName = name;
    document.getElementById('modal-cliente').classList.remove('open');
    document.getElementById('cliente-nombre').value = '';
    errEl.textContent = '';
    showToast(`Sesión con ${name} iniciada`);
  } catch(e) {
    errEl.style.color = '#E24B4A';
    errEl.textContent = 'Error de conexión. Inténtalo de nuevo.';
  }
}

// ── GUARDAR CARTA EN SUPABASE ──
async function saveCardToSupabase(card) {
  if (!currentSessionId) return;
  await supa.from('session_cards').insert({
    session_id: currentSessionId,
    card_number: card.n,
    card_en: card.en,
    card_es: card.es,
    card_cat: card.cat,
    notes: ''
  });
}

// ── GUARDAR NOTA EN SUPABASE ──
async function saveNoteToSupabase(cardN, note) {
  if (!currentSessionId) return;
  await supa.from('session_cards')
    .update({ notes: note })
    .eq('session_id', currentSessionId)
    .eq('card_number', cardN);
}

// ── HISTORIAL ──
async function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = `<div class="session-empty" style="padding:40px 0;text-align:center;color:var(--text-muted);font-family:'Montserrat',sans-serif;font-size:1.1rem;font-style:italic">Cargando...</div>`;
  if (!currentUser) return;
  const { data: sessions } = await supa.from('sessions')
    .select('*, session_cards(*)')
    .eq('facilitator_id', currentUser.id)
    .order('created_at', { ascending: false });
  if (!sessions || !sessions.length) {
    list.innerHTML = `<div class="session-empty" style="padding:40px 0;text-align:center;color:var(--text-muted);font-family:'Montserrat',sans-serif;font-size:1.1rem;font-style:italic">No hay sesiones guardadas todavía</div>`;
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="history-item" onclick="toggleHistoryDetail('${s.id}')">
      <div class="history-client">${s.client_name}</div>
      <div class="history-date">${new Date(s.created_at).toLocaleDateString('es-ES', {day:'2-digit',month:'long',year:'numeric'})}</div>
      <div class="history-cards">
        ${(s.session_cards||[]).map(c => `<span class="history-card-tag">${c.card_en}</span>`).join('')}
      </div>
      <div class="history-detail" id="hd-${s.id}">
        ${(s.session_cards||[]).map(c => `
          <div class="history-detail-card">
            <div class="hdc-thumb"><img src="${IMG_BASE}${c.card_number}.jpg" onerror="this.style.display='none'"><div class="img-protect"></div></div>
            <div class="hdc-info">
              <div class="en">${c.card_en}</div>
              <div class="es">${c.card_es}</div>
              ${c.notes ? `<div class="note">${c.notes}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleHistoryDetail(id) {
  const el = document.getElementById('hd-' + id);
  el.classList.toggle('open');
}

// ── VIEWS (override para historial) ──
const _origShowView = showView;
function showView(v, btn) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  if (btn) btn.classList.add('active');
  if (v === 'session') renderSession();
  if (v === 'history') renderHistory();
}

// ── INIT ──
try {
  const saved = localStorage.getItem('ijm_notes');
  if (saved) state.notes = JSON.parse(saved);
} catch(e) {}

buildPills('home-pills', 'all', setHomeFilter);
buildPills('explore-pills', 'all', setExploreFilter);
updateDeckInfo();
renderExploreGrid();

// Comprobar sesión activa
supa.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    onLogin(session.user);
  }
});
</script>

<script>
/* ── Protección de imágenes ── */
document.addEventListener('contextmenu', function(e) {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    return false;
  }
});
document.addEventListener('dragstart', function(e) {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    return false;
  }
});
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    return false;
  }
});
</script>
